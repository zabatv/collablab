<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#14161a">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход — ROBOT</title>
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css?v=20261015">
  <style>
    /* Split screen: what the panel is on the left, the way in on the right */
    .login-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
    }

    .login-side {
      box-sizing: border-box;
      padding: var(--space-2xl) var(--space-xl);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-2xl);
      color: #fff;
      background-color: var(--ink);
      /* A hairline grid, the way a drawing is set out */
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .login-side .logo {
      color: #fff;
    }

    .login-headline {
      font-size: clamp(28px, 3.2vw, 44px);
      font-weight: 760;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: var(--space-md);
    }

    .login-side p {
      font-size: var(--text-base);
      line-height: 1.6;
      color: #9aa3ad;
      max-width: 40ch;
    }

    .login-figures {
      display: flex;
      gap: var(--space-xl);
      flex-wrap: wrap;
    }

    .login-figure-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: var(--text-xl);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .login-figure-label {
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6f7883;
    }

    .login-main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl) var(--space-xl);
    }

    .login-card {
      width: 100%;
      max-width: 372px;
    }

    .login-card h1 {
      font-size: var(--text-xl);
      margin: var(--space-xs) 0 var(--space-xl);
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: var(--space-md);
    }

    .login-field label {
      font-size: var(--text-sm);
      font-weight: 620;
    }

    .login-field input {
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      font-size: 14px;
      background: var(--surface);
      outline: none;
      transition: border-color var(--quick) ease, box-shadow var(--quick) ease;
    }

    .login-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-wash);
    }

    .login-submit {
      width: 100%;
      height: 48px;
      margin-top: var(--space-xs);
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background-color var(--quick) ease, transform var(--press) var(--ease-out);
    }

    .login-submit:active {
      transform: scale(0.98);
    }

    .login-submit:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .login-submit:not(:disabled):hover {
        background: #2a2e35;
      }
    }

    .login-error {
      display: none;
      margin-bottom: var(--space-md);
      padding: var(--space-sm) 14px;
      border-radius: var(--radius-sm);
      background: #fdecea;
      color: #a51f14;
      font-size: var(--text-sm);
      line-height: 1.45;
    }

    .login-error.visible {
      display: block;
    }

    .login-back {
      display: block;
      margin-top: 22px;
      text-align: center;
      font-size: var(--text-sm);
      color: var(--ink-muted);
    }

    /* Under 16px Android zooms the page in on focus and never zooms back out */
    @media (pointer: coarse) {
      .login-field input {
        font-size: 16px;
        height: 50px;
      }
    }

    /* On a phone the panel becomes a band at the top instead of half the screen */
    @media (max-width: 900px) {
      .login-page {
        grid-template-columns: minmax(0, 1fr);
        /* The band takes what it needs, the form takes the rest */
        grid-template-rows: auto minmax(0, 1fr);
      }

      .login-side {
        padding: var(--space-lg) var(--space-md);
        gap: var(--space-md);
        justify-content: flex-start;
      }

      .login-side p,
      .login-figures {
        display: none;
      }

      .login-headline {
        margin-bottom: 0;
      }

      .login-main {
        padding: var(--space-xl) var(--space-md);
      }
    }
  </style>
</head>
<body>
  <div class="login-page">

    <aside class="login-side">
      <a class="logo logo-inverted" href="index.html" aria-label="РОБОТ — на сайт">
        <img src="img/logo.png" alt="РОБОТ" width="504" height="240">
      </a>

      <div>
        <div class="login-headline">Панель управления каталогом</div>
        <p>Товары, фотографии, характеристики, импорт и выгрузка прайса, SEO-аналитика.</p>
      </div>

      <!-- Counted from the catalogue itself, and simply left out if it is unreachable -->
      <div class="login-figures" id="login-figures" hidden></div>
    </aside>

    <main class="login-main">
      <form class="login-card" id="login-form" autocomplete="on">
        <div class="eyebrow">Служебный вход</div>
        <h1>Вход в админку</h1>

        <div class="login-error" id="login-error"></div>

        <div class="login-field">
          <label for="login-username">Логин</label>
          <input type="text" id="login-username" name="username" autocomplete="username" required autofocus>
        </div>

        <div class="login-field">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="login-submit" id="login-submit">Войти</button>

        <a href="index.html" class="login-back">Вернуться на сайт</a>
      </form>
    </main>

  </div>

  <script src="js/config.js?v=20261015"></script>
  <script src="js/adapter-node.js?v=20261015"></script>
  <script src="js/api.js?v=20261015"></script>
  <script src="js/main.js?v=20261015"></script>
  <script src="js/effects.js?v=20261015"></script>
  <script>
    const form = el('#login-form');
    const errorBox = el('#login-error');
    const submitBtn = el('#login-submit');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    // Already signed in: skip the form
    AuthAPI.isSignedIn().then(signedIn => {
      if (signedIn) window.location.replace('admin.html');
    });

    // The panel says what is behind the door, in numbers that are actually true
    async function loadFigures() {
      try {
        const categories = await ProductAPI.getCategories();
        // Товары лежат в подкатегориях, поэтому считается вся ветка
        const count = (category) => category.total_count ?? category.product_count;
        const products = categories.reduce((sum, category) => sum + count(category), 0);
        const filled = categories.filter(category => count(category) > 0).length;
        if (!products) return;

        const host = el('#login-figures');
        host.innerHTML = [
          { count: products, label: 'позиций' },
          { count: filled, label: 'категорий' },
        ].map(figure => `
          <div>
            <div class="login-figure-value" data-count-to="${figure.count}">${figure.count}</div>
            <div class="login-figure-label">${figure.label}</div>
          </div>
        `).join('');
        host.hidden = false;
      } catch (error) {
        // A panel without numbers is better than a panel with invented ones
      }
    }

    loadFigures();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.classList.remove('visible');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Проверяем…';

      try {
        await AuthAPI.login(el('#login-username').value.trim(), el('#login-password').value);
        window.location.replace('admin.html');
      } catch (error) {
        showError(error.message);
        el('#login-password').value = '';
        el('#login-password').focus();
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти';
      }
    });
  </script>
</body>
</html>
