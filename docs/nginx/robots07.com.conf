# robots07.com: страницы сайта с этого VPS, каталог — с Windows-компьютера
# рядом с 1С, через WireGuard-туннель. Разбор в docs/deploy-robots07.md.
#
#   cp docs/nginx/robots07.com.conf /etc/nginx/sites-available/robots07.com
#   ln -sf /etc/nginx/sites-available/robots07.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Кэш медиа объявляется отдельно, в /etc/nginx/conf.d/shop-cache.conf.

upstream shop_backend {
    server 10.8.0.2:3000;
    keepalive 16;
}

# Админский сервер того же компьютера. Отвечает, только если на Windows
# в .env стоит ADMIN_HOST=10.8.0.2 и открыт порт 3001 для 10.8.0.1;
# при ADMIN_HOST=127.0.0.1 этот блок просто отдаёт 502 и никому не мешает.
upstream shop_admin {
    server 10.8.0.2:3001;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name robots07.com www.robots07.com;

    root /var/www/collablab/frontend;
    index index.html;

    # Адреса без .html: /catalog открывает catalog.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Фото и видео товаров. Через туннель тянутся только первый раз,
    # дальше отдаются с VPS. Объявлено до /api/, но nginx всё равно
    # выбирает самый длинный подходящий префикс.
    location /api/media/ {
        proxy_pass http://shop_backend/media/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache shop_media;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status;
        expires 1d;
    }

    # Каталог. Слэш в конце proxy_pass срезает префикс: /api/products
    # приходит к ним как /products.
    location /api/ {
        proxy_pass http://shop_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Правка каталога. Сервер за этим адресом принимает только запросы
    # с логином и паролем (HTTP Basic), так что за ним стоит следить:
    # пароль здесь — единственное, что отделяет каталог от интернета.
    location /admin-api/ {
        proxy_pass http://shop_admin/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Видео товара весит до 200 МБ и заливается не быстро
        client_max_body_size 300m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Наш сервис на этом же VPS: бренды, слайдер на главной, описания
    # разделов, счётчики и SEO. Их бэкенд ничего из этого не умеет и не
    # будет — из 1С такие вещи не приходят, — а менять их должен заказчик
    # из админки. Запись закрыта тем же логином и паролем, что и админский
    # сервер на Windows.
    location /site-api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Видео раздела весит столько же, сколько видео товара, и грузится
        # так же небыстро
        client_max_body_size 300m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Прежнее имя того же сервиса: он начинался с одних брендов
    location /brands-api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;   # логотип
    }

    # Компьютер выключен или туннель упал
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/shop;
        internal;
    }
}
